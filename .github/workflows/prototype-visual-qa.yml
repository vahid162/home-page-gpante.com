name: Prototype Visual QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-visual-qa.yml"
  push:
    branches:
      - main
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-visual-qa.yml"

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright for QA only
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run responsive visual QA
        run: node prototype/qa/visual-check.mjs

      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-visual-qa
          path: prototype/qa/output/
          if-no-files-found: error
          retention-days: 14
